<!DOCTYPE html>
<html>
    <body>
        <h1>
            Welcome to our Multi-Media Project
        </h1>
        <h2>
            Paragraphs and Text Formatting
        </h2>
        <p>
            This is a <b>bold</b> text and this is <i>italic</i>.
            We can also use <u>underline</u> and <del>strikethrough</del>.
        </p>
        <h2>
            Images
        </h2>
        <img src="images/brain.jpg" width="300">
        <h2>Audio</h2>
        <audio controls loop>
            <source src="sounds/code.mp3" type="audio/mpeg">
        </audio>
        <h2>
            Video
        </h2>
        <video controls loop width="400" poster="images/code.png">
        <source src="video/coding.mp4" type="video/mp4">        
        </video>
    </body>
</html>
